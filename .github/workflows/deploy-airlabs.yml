name: Deploy AirLabs Collector

on:
  push:
    branches:
      - master
      - change-docker-architecture   # à retirer après la fusion
    paths:
      - "src/airlabs_collect/**"
      - "docker/collect/**"
      - ".github/workflows/deploy-airlabs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  SERVICE: liora-airline-project-sep26-airlabs-collect
  IMAGE: europe-west1-docker.pkg.dev/project-0845983d-30e1-47a7-a62/airline/airlabs-collect

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/collect/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=airlabs-collect
          cache-to: type=gha,mode=max,scope=airlabs-collect

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            AIRLABS_API_KEYS=airlabs-api-keys:latest