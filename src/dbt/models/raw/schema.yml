
version: 2

sources:
  - name: raw
    database: airline
    schema: raw
    tables:
      - name: airlabs_airports
        description: "List of Airports from Airlabs API"
        columns:
          - name: iata_code
            description: "IATA Code of Airport"
          - name: icao_code
            description: "ICAO Code of Airport"
          - name: name
            description: "Name of Airport"
          - name: lat
            description: "Latitude of Airport"
          - name: lng
            description: "Longitude of Airport"
      - name: airlabs_airlines
        description: "List of Airlines from Airlabs API"
        columns:
          - name: iata_code
            description: "IATA Code of Airport"
          - name: icao_code
            description: "ICAO Code of Airport"
          - name: name
            description: "Name of Airport"
      - name: airlabs_schedules
        description: "Schedules from Airlabs API"
        columns:
          - name: id
            description: "Internal ID of Schedule"
          - name: airline_icao
            description: "ICAO of Airline"
          - name: flight_icao
            description: "ICAO code of Flight"
      - name: meteo_hourly
        description: "Hourly weather from Open-Meteo archive"
        columns:
          - name: icao
            tests:
              - not_null
          - name: time
            tests:
              - not_null    
     

  