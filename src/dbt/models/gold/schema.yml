version: 2

models:
  - name: dim_flights
    description: "Dim List of Flights from Airlabs Schedules"
    columns:
      - name: flight_id
        description: "ID of Flight (for one hour when recycled)"
        tests:
          - unique
          - not_null
  - name: dim_airports
    description: "List of Airports from Airlabs Schedules"
    columns:
      - name: airport_id
        description: "Internal ID of Airport"
        tests:
          - unique
          - not_null
  - name: dim_airlines
    description: "List of Airlines"
    columns:
      - name: airline_id
        description: "Internal ID of airline"
        tests:
          - unique
          - not_null
  - name: dim_weather_codes
    description: "WMO 4677 weather codes with category (tens) and subcategory (units)"
    columns:
      - name: weather_code
        tests:
          - unique
          - not_null
  - name: fact_weather_hourly
    description: "Hourly weather per airport for the AirLabs period (UTC)"
    columns:
      - name: weather_id
        tests:
          - unique
          - not_null
      - name: weather_code
        tests:
          - relationships:
              to: ref('dim_weather_codes')
              field: weather_code
  - name: fact_flights
    description: "AirLabs arrivals to Paris, one row per flight, target delay (> 15 min)"
    columns:
      - name: schedule_id
        tests:
          - unique
          - not_null
      - name: dep_hour
        description: "Scheduled departure rounded to the hour (UTC), join key with departure weather"
      - name: arr_airport_id
        tests:
          - relationships:
              to: ref('dim_airports')
              field: airport_id
      - name: airline_id
        tests:
          - relationships:
              to: ref('dim_airlines')
              field: airline_id
