
version: 2

models:
  - name: stg_schedules
    description: "List of Flights from Airlabs Schedules"
    columns:
      - name: id
        description: "ID of Flight (for one hour when recycled)"
        tests:
          - unique
          - not_null
  - name: stg_flights
    description: "List of Flights from Airlabs Schedules"
    columns:
      - name: flight_id
        description: "ID of Flight (for one hour when recycled)"
        tests:
          - unique
          - not_null
  - name: stg_airports
    description: "List of Airports from Airlabs Schedules"
    columns:
      - name: airport_id
        description: "Internal ID of Airport"
        tests:
          - unique
          - not_null
  - name: stg_airlines
    description: "List of Airlines"
    columns:
      - name: airline_id
        description: "Internal ID of airline"
        tests:
          - unique
          - not_null
  - name: stg_opdi_flights
    description: "OPDI arrivals to Paris airports, cleaned"
    columns:
      - name: id
        tests:
          - unique
          - not_null
  - name: stg_weather_hourly
    description: "Hourly weather per airport (UTC)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['icao', 'time']
  - name: stg_flight_schedule_ref
    description: "Scheduled times per flight and route (AirLabs, Paris local time)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['flt_id', 'adep', 'ades']