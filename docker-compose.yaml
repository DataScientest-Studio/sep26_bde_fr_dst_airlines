services:
# ============================================================
# PostgreSQL : Nous prenons la derniere version stable a date
# ============================================================
  database:
    container_name: pg_container
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      POSTGRES_DB: airline
    ports:
      - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql
        - ./docker/postgres/init:/docker-entrypoint-initdb.d

        
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin  -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # ============================================================
  # Spark & ML : Nous utilisons plutot un docker que le tgz ce sera
  #              plus pratique et plus "Data Engineer"
  # ============================================================
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark
    restart: unless-stopped
    volumes:
      - ./src/notebooks:/app/jobs
      - ./src/spark:/app/src
      - /home/airline/workspace/spark:/app/workspace

  # ============================================================
  # Jupyter + PySpark
  # ============================================================
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile

    image: liora-jupyter-pyspark
    container_name: jupyter_pyspark
    restart: unless-stopped
    
    user: root
    
    entrypoint:
      - /usr/bin/tini
      - -g
      - --
      - /usr/local/bin/start-jupyterhub.sh
    
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      JUPYTER_PASSWORD_HERVE: ${JUPYTER_PASSWORD_HERVE}
      JUPYTER_PASSWORD_PASCAL: ${JUPYTER_PASSWORD_PASCAL}
    volumes:
      - /home/airline/workspace/jupyter/notebooks:/home/jovyan/work    # Workspace tored on VM outside repos structure

    #command: >
    #  start-notebook.py
    #  "--PasswordIdentityProvider.hashed_password=argon2:$$argon2id$$v=19$$m=10240,t=10,p=8$$/ow7txS+odVsD4ZqIP4Bnw$$V560bJDlDhBrK7xAYgjWReBHWu3IQoMuFDPal+3stfw"

  # ============================================================
  # Airflow Init
  # ============================================================
  airflow-init:
    image: apache/airflow:3.3.2

    depends_on:
      database:
        condition: service_healthy
        
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}

    command: db migrate
      

    restart: "no"


  # ============================================================
  # Airflow Scheduler
  # ============================================================
  airflow-scheduler:
    image: apache/airflow:3.3.2
    container_name: airflow_scheduler
    restart: unless-stopped

    group_add:
    - "1001"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "herve:admin,pascal:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/passwords.json"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow_api_server:8080/execution/"
    volumes:
      # Les dag seront dans src/airflow/dag et seront donc deployés via git
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      # Recupere les mdp des secrets github et les ecrits
      - ./docker/airflow/passwords.json:/opt/airflow/passwords.json
      # Permet au conteneur Airflow d'accéder au démon Docker de l'hôte
      # Nécessaire pour exécuter des commandes docker exec, docker run, etc.
      - /var/run/docker.sock:/var/run/docker.sock 
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins
      - /home/airline/repos:/home/airline/repos    # Donne acces au docker compose sur la VM pour utiliser docker compose pour DBT
    command: scheduler


  # ============================================================
  # Airflow API Server / UI
  # ============================================================
  airflow-api-server:
    image: apache/airflow:3.3.2
    container_name: airflow_api_server
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "herve:admin,pascal:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/passwords.json"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow_api_server:8080/execution/"
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./docker/airflow/passwords.json:/opt/airflow/passwords.json
      - /home/airline/repos:/home/airline/repos    # Donne acces au docker compose sur la VM pour utiliser docker compose pour DBT

    command: api-server

    ports:
      - "8080:8080"

  # ============================================================
  # Airflow DAG Processor : To load DAG Files
  # ============================================================
  airflow-dag-processor:
    image: apache/airflow:3.3.2
    container_name: airflow_dag_processor
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "herve:admin,pascal:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/passwords.json"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow_api_server:8080/execution/"

    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./docker/airflow/passwords.json:/opt/airflow/passwords.json
      - /home/airline/repos:/home/airline/repos    # Donne acces au docker compose sur la VM pour utiliser docker compose pour DBT

    command: dag-processor

  # ============================================================
  # Interface pour gerer les conteneurs
  # ============================================================
  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  # ============================================================
  # dbt
  # ============================================================
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile

    container_name: dbt
    
    environment:
      DBT_PASSWORD: ${DBT_BATCH_PASSWORD}
      DBT_HOST: database
      DBT_USER: batch
      DBT_PORT: 5432
      DBT_DATABASE: airline
      DBT_SCHEMA: silver

    depends_on:
      - database

    volumes:
      # Projet DBT
      - ./src/dbt:/usr/app
      # Profil DBT
      - ./docker/dbt/profiles.yml:/root/.dbt/profiles.yml:ro


    working_dir: /usr/app

    profiles:
      - tools

  # ============================================================
  # ML Flow
  # ============================================================
  # mlflow:
  #   build:
  #     context: .
  #     dockerfile: docker/mlflow/Dockerfile

  #   container_name: mlflow
    
  #   ports:
  #     - "5000:5000"
    
  #   depends_on:
  #     - database
        
    
  #   command: >
  #     mlflow server
  #     --host 0.0.0.0
  #     --port 5000
  #     --backend-store-uri postgresql://admin:admin@postgres:5432/mlflow
  #     --default-artifact-root /mlflow/artifacts
    
  #   volumes:
  #     - mlflow_artifacts:/mlflow/artifacts


  # ============================================================
  # Fast API
  # ============================================================
  api:
    build: 
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: airline_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      PG_HOST: database
      PG_PORT: 5432
      PG_DATABASE: airline
      PG_USER: batch
      PG_PASSWORD: ${DBT_BATCH_PASSWORD}
      API_KEY: ${FASTAPI_KEY}

    restart: unless-stopped

    volumes:
      - ./src/api:/app/src/api

  # ============================================================
  # Frontend Streamlit
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: frontend
    ports:
      - "8501:8501"

    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

    volumes:
      # Code source en développement
      - ./src/frontend:/app

      # Secrets montés en lecture seule
      - ./src/frontend/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

      # Model IA monté
      - ./models:/app/models

    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
  portainer_data:
  mlflow_artifacts:


